<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>IoT Intrusion Detection — Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; background:#0f1419; color:#e6e6e6; }
    h1 { font-size: 1.3rem; }
    .counters { display:flex; gap:1rem; margin:1rem 0; }
    .card { background:#1b2330; border-radius:8px; padding:0.8rem 1.2rem; }
    .card .n { font-size:1.6rem; font-weight:700; }
    .charts { display:flex; gap:1.5rem; flex-wrap:wrap; margin:1rem 0; }
    .chart-box { background:#1b2330; border-radius:8px; padding:1rem; width:320px; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; }
    th, td { text-align:left; padding:0.4rem 0.6rem; border-bottom:1px solid #2a3442; font-size:0.9rem; }
    .sev-HIGH, .sev-CRITICAL { color:#ff6b6b; }
    .sev-MEDIUM { color:#ffd166; }
    .src-ML { color:#7cc4ff; }
    .chat-toggle { position:fixed; right:1.2rem; bottom:1.2rem; z-index:20;
      background:#4f8cff; color:#fff; border:none; border-radius:24px;
      padding:0.7rem 1.1rem; font-size:0.95rem; cursor:pointer; }
    .chat-drawer { position:fixed; top:0; right:0; height:100%; width:380px;
      max-width:100%; background:#141b26; border-left:1px solid #2a3442;
      transform:translateX(100%); transition:transform .2s ease; z-index:30;
      display:flex; flex-direction:column; }
    .chat-drawer.open { transform:translateX(0); }
    .chat-header { display:flex; justify-content:space-between; align-items:center;
      padding:0.8rem 1rem; border-bottom:1px solid #2a3442; font-weight:600; }
    .chat-btn { background:none; border:1px solid #2a3442; color:#e6e6e6;
      border-radius:6px; padding:0.25rem 0.5rem; cursor:pointer; font-size:0.8rem; margin-left:0.4rem; }
    .chat-messages { flex:1; overflow-y:auto; padding:1rem; display:flex;
      flex-direction:column; gap:0.6rem; }
    .msg { padding:0.5rem 0.75rem; border-radius:10px; max-width:85%;
      font-size:0.9rem; line-height:1.35; white-space:pre-wrap; word-break:break-word; }
    .msg.user { align-self:flex-end; background:#2f4f77; }
    .msg.bot { align-self:flex-start; background:#1b2330; }
    .msg.error { align-self:flex-start; background:#3a1e22; color:#ff9b9b; }
    .msg.error .retry { margin-left:0.5rem; background:none; border:1px solid #ff9b9b;
      color:#ff9b9b; border-radius:5px; cursor:pointer; font-size:0.75rem; padding:0 0.4rem; }
    .chat-typing { padding:0 1rem 0.4rem; color:#8aa0b8; font-size:0.85rem; }
    .chat-input-row { display:flex; gap:0.5rem; padding:0.8rem; border-top:1px solid #2a3442; }
    .chat-input { flex:1; resize:none; background:#0f1419; color:#e6e6e6;
      border:1px solid #2a3442; border-radius:8px; padding:0.5rem; font:inherit; }
    .chat-send { background:#4f8cff; color:#fff; border:none; border-radius:8px;
      padding:0 1rem; cursor:pointer; }
    .chat-send:disabled, .chat-input:disabled { opacity:0.5; cursor:not-allowed; }
    .msg.bot ul, .msg.bot ol { margin:0.3rem 0 0.3rem 1.1rem; }
    .msg.bot code { background:#0f1419; padding:0 0.25rem; border-radius:4px; }
    .msg.bot p { margin:0.3rem 0; }
    .chat-chips { display:flex; flex-wrap:wrap; gap:0.4rem; padding:0 1rem 0.6rem; }
    .chip { background:#1b2330; border:1px solid #2a3442; color:#cfe0f2;
      border-radius:16px; padding:0.35rem 0.7rem; font-size:0.8rem; cursor:pointer; }
  </style>
</head>
<body>
  <h1>IoT Intrusion Detection — Live Dashboard</h1>
  <div class="counters">
    <div class="card"><div>Total</div><div class="n" id="c-total">0</div></div>
    <div class="card"><div>High+</div><div class="n" id="c-high">0</div></div>
    <div class="card"><div>Live</div><div class="n" id="c-live">0</div></div>
  </div>
  <div class="charts">
    <div class="chart-box"><canvas id="chart-type"></canvas></div>
    <div class="chart-box"><canvas id="chart-severity"></canvas></div>
    <div class="chart-box"><canvas id="chart-source"></canvas></div>
  </div>
  <h2>Recent alerts</h2>
  <table>
    <thead><tr><th>Time</th><th>Source</th><th>Type</th><th>Severity</th><th>Detector</th><th>Score</th><th>Rule</th></tr></thead>
    <tbody id="alert-rows"></tbody>
  </table>

  <!-- Chat drawer -->
  <button id="chat-toggle" class="chat-toggle">Sor 🤖</button>
  <aside id="chat-drawer" class="chat-drawer" aria-label="Alert asistanı">
    <header class="chat-header">
      <span>Alert Asistanı</span>
      <span>
        <button id="chat-new" class="chat-btn" title="Yeni sohbet">Yeni sohbet</button>
        <button id="chat-close" class="chat-btn" title="Kapat">✕</button>
      </span>
    </header>
    <div id="chat-messages" class="chat-messages"></div>
    <div id="chat-typing" class="chat-typing" style="display:none">asistan yazıyor…</div>
    <div id="chat-chips" class="chat-chips"></div>
    <div class="chat-input-row">
      <textarea id="chat-input" class="chat-input" rows="2" placeholder="Alert'ler hakkında sor…"></textarea>
      <button id="chat-send" class="chat-send">Gönder</button>
    </div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script src="/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
