version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Version-update PRs for direct dependencies, minor and patch releases
    # only. Major upgrades need code changes and are done deliberately;
    # transitive packages move with their parents. Security updates are not
    # affected by this rule and still arrive for any version or dependency.
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    # One weekly PR per ecosystem instead of one per package; also avoids
    # lockfile conflicts between sibling PRs. Security updates stay separate.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
